# CLA Assistant: asks first-time contributors to sign CLA.md and records the signatures in this repository.
# Signatures are stored in signatures/version1/cla.json on the `cla-signatures` branch.
#
# One-time setup by a maintainer:
#   1. Create the branch:  git push origin <any-commit>:refs/heads/cla-signatures
#   2. Do not protect `cla-signatures` (the workflow commits to it with GITHUB_TOKEN).
#   3. Settings -> Actions -> General -> Workflow permissions: "Read and write permissions".
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write        # commit signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event_name == 'pull_request_target') ||
          (github.event.issue.pull_request &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot],renovate[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, please read the
            [Contributor License Agreement](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md)
            and sign it by posting the comment below on this pull request. One signature covers all your future
            contributions.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
