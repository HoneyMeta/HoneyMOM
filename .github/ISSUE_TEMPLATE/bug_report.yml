name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys, passwords, model tokens or customer data.
        Security problems go to dev@honeymeta.com or a private advisory (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with `docker compose up`
        2. Log in as admin, open Production Operations → Work Orders
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      options:
        - docker compose (demo mode)
        - docker compose (production mode)
        - bare metal / python -m honeymom serve
        - other
    validations:
      required: true
  - type: dropdown
    id: db
    attributes:
      label: Database
      options:
        - SQLite
        - PostgreSQL
        - PostgreSQL + TimescaleDB
    validations:
      required: true
  - type: input
    id: lang
    attributes:
      label: UI language and browser
      placeholder: en, Chrome 131
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output (`docker compose logs mom`) or the browser console, if relevant.
      render: text
